<style>
  :root{
    --bg: #f1efe9;
    --ink: #17181a;
    --sub: #4a4b4d;
    --accent: #ff2e78;
    --accent2: #6d3bf5;
    --line: rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:#0c0c0d;
    font-family:"Inter","Hind Siliguri",system-ui,sans-serif;
    color:var(--ink);
    height:100%;
    overflow:hidden;
  }
  .deck{ width:100vw; height:100vh; position:relative; }
  .slide{
    position:absolute; inset:0; width:100%; height:100%;
    display:none;
  }
  .slide.active{ display:block; }

  .stage{
    position:absolute; top:50%; left:50%;
    width:1920px; height:1080px;
    transform-origin:center center;
    background:var(--bg);
    overflow:hidden;
    box-shadow:0 40px 120px rgba(0,0,0,0.5);
  }
  .stage.dark{ background:#111225; color:#fff; }

  .wavy{ position:absolute; left:-60px; bottom:-80px; width:760px; height:auto; opacity:0.55; pointer-events:none; }
  .wavy.light{ opacity:0.14; }

  .logo{ position:absolute; top:56px; left:80px; display:flex; align-items:center; gap:10px; z-index:3;}
  .logo svg{ height:30px; width:auto; }
  .logo-word{ font-weight:800; font-size:24px; letter-spacing:-0.5px; color:#1a1a2e; }
  .stage.dark .logo-word{ color:#fff; }

  .crumb{
    position:absolute; top:60px; right:80px;
    font-size:15px; color:var(--sub); font-weight:600;
    letter-spacing:0.2px; text-align:right;
    z-index:3;
  }
  .stage.dark .crumb{ color:rgba(255,255,255,0.6); }

  /* COVER — Figma "Hero Slide" (240:26573), 1920x1080 1:1 */
  .stage.hero{ background:#fff; }
  .hero-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .hero-logo{ position:absolute; left:209.1px; top:58.97px; width:296.3px; height:125.8px; z-index:5; }
  .hero-logo img{ width:100%; height:100%; display:block; }
  .hero-title{
    position:absolute; left:586px; top:152px; width:661px; padding:12px 0 14px; z-index:5;
    font-family:"Satoshi","Inter",sans-serif; font-weight:900;
    font-size:100px; line-height:88px; letter-spacing:-1px;
    background-image:linear-gradient(180deg,#2d4797 0%,#5367fd 140.34%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-subtitle{
    position:absolute; left:1292px; top:114px; width:458px; z-index:5;
    font-family:"Satoshi","Inter",sans-serif; font-weight:400;
    font-size:32px; line-height:40px; letter-spacing:-0.32px; color:#0c1a43;
  }
  .hero-collage{ position:absolute; left:220.5px; top:312px; width:1524.5px; height:674px; z-index:2; display:block; }
  .hero-decor-l{ position:absolute; left:-132.1px; top:222.05px; width:489px; height:414px; z-index:1; pointer-events:none; }
  .hero-decor-r{ position:absolute; left:1596.7px; top:799.5px; width:326px; height:344px; z-index:1; pointer-events:none; mix-blend-mode:luminosity; }
  .hero-decor-l img, .hero-decor-r img{ width:100%; height:100%; display:block; }
  .hero-decor-r img{ transform:rotate(-37.03deg); }
  .hero-footer{
    position:absolute; left:70.3px; top:991px; width:1778.4px; z-index:5;
    display:flex; justify-content:space-between; padding-top:15.75px; border-top:0.75px solid #dfe5f0;
    font-family:"Satoshi","Inter",sans-serif; font-weight:500; font-size:24px; line-height:21px; color:#fff;
  }

  /* INTRO SLIDES — Figma "Slide 02" (256:27572) and "One engine" (256:28447) */

  .intro-decor{ position:absolute; z-index:1; pointer-events:none; }
  .intro-decor img{ width:100%; height:100%; display:block; }
  .intro-art{ position:absolute; z-index:2; display:block; }
  .intro-header-bar-rule{ position:absolute; left:67px; top:197px; width:1786px; height:1px; background:rgba(255,255,255,0.4); z-index:2; }
  .routes-title{
    position:absolute; left:67px; top:140px; width:1600px; z-index:2;
    font-family:"Satoshi","Inter",sans-serif; font-weight:700; text-transform:uppercase;
    font-size:80px; line-height:1.1; letter-spacing:-2.4px; color:#f4f5e7;
  }
  .routes-lead, .routes-behind{
    position:absolute; z-index:2; font-family:"Satoshi","Inter",sans-serif; font-weight:700;
    font-size:56px; line-height:1.1; letter-spacing:-1.68px; color:#f7fbff; text-transform:capitalize;
  }
  .routes-lead{ left:67px; top:271px; width:1710px; }
  .routes-behind{ left:460px; top:809px; width:462px; text-align:right; }
  .engine-title{
    position:absolute; left:358px; top:132px; width:1204px; z-index:2; text-align:center;
    font-family:"Satoshi","Inter",sans-serif; font-weight:700; text-transform:uppercase;
    font-size:100px; line-height:1.1; letter-spacing:-3px; color:#f4f5e7;
  }
  /* Flow arrows into the shared engine: drawn from each product into the engine (stroke reveal), head lands last */
  .flow-arrow{ position:absolute; z-index:2; overflow:visible; pointer-events:none; }
  .flow-arrow path{ fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .flow-line{ stroke-dasharray:1 1; }
  .slide.play .flow-line{ animation:flow-draw 800ms var(--ease-out) calc(900ms + var(--d)) backwards; }
  .slide.play .flow-head{ animation:flow-head 260ms var(--ease-out) calc(1560ms + var(--d)) backwards; }
  @keyframes flow-draw{ from{ stroke-dashoffset:1; } }
  @keyframes flow-head{ from{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .slide.play .flow-line, .slide.play .flow-head{ animation:none; } }
  /* Closing slide (Figma 260:2731) */
  .close-title{ position:absolute; left:65px; top:140px; width:1606px; z-index:2;
    font-family:"Satoshi","Inter",sans-serif; font-weight:700; font-size:110px; line-height:1.1; letter-spacing:-3.3px; color:#f4f5e7; padding-bottom:12px; }
  .close-title span{ background-image:linear-gradient(180deg,#2d4797 36.435%,#5367fd 140.34%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .close-list{ position:absolute; left:131.8px; top:504px; z-index:2; display:flex; align-items:center; gap:60px; }
  .close-card{ width:400px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .close-icon{ position:relative; height:240px; overflow:hidden; }
  .close-icon img{ position:absolute; top:0; height:100%; max-width:none; display:block; }
  .close-num{ padding-top:22.566px; font-family:"Inter",sans-serif; font-weight:500; font-size:22.857px; letter-spacing:1.8px; color:#e2008d; }
  .close-h{ padding-top:10.832px; font-family:"Satoshi","Inter",sans-serif; font-weight:700; font-size:48px; color:#0c1a43; }
  .close-p{ padding-top:10.832px; font-family:"Satoshi","Inter",sans-serif; font-weight:400; font-size:24px; line-height:32.179px; color:#0c1a43; white-space:nowrap; }
  .close-arrow{ width:107.965px; height:24.953px; display:block; }
  /* Final slide (Figma 359:14163) */
  .finale-title{ position:absolute; left:98px; top:177px; width:1606px; z-index:2;
    font-family:"Satoshi","Inter",sans-serif; font-weight:700; font-size:80px; line-height:1.1; letter-spacing:-2.4px; padding-bottom:10px;
    background-image:linear-gradient(180deg,#2d4797 36.435%,#5367fd 140.34%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .finale-title span{ color:#5468ff; -webkit-text-fill-color:#5468ff; }
  .finale-decor{ position:absolute; left:-65.09px; top:763.02px; width:1059.07px; height:288.9px; z-index:1; pointer-events:none; }
  .finale-cta{ position:absolute; left:1123px; top:856px; z-index:4; display:flex; align-items:center; gap:21px;
    padding:0; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .finale-cta span{ display:block; height:137px; font-family:"Satoshi","Inter",sans-serif; font-weight:700; font-size:110px; line-height:1.1; letter-spacing:-3.3px;
    background-image:linear-gradient(180deg,#2d4797 36.435%,#5367fd 140.34%); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-decoration:underline wavy #4a5fe0; text-decoration-thickness:6.5%; text-underline-offset:14px; }
  .finale-cta img{ width:98px; height:98px; display:block; transition:transform 450ms var(--ease-out); }
  .finale-cta:focus-visible{ outline:3px solid #5468ff; outline-offset:12px; border-radius:16px; }
  @media (hover:hover) and (pointer:fine){ .finale-cta:hover img{ transform:rotate(-180deg); } }
  @media (prefers-reduced-motion: reduce){ .finale-cta img{ transition:none; } }
  .engine-note{
    position:absolute; left:1426px; top:873px; width:385px; z-index:2; text-align:right;
    font-family:"Satoshi","Inter",sans-serif; font-weight:400; font-size:32px; line-height:0.98; color:#262626;
  }

  /* DIVIDER */
  .divider-num{
    position:absolute; left:80px; top:140px;
    font-size:22px; font-weight:700; letter-spacing:4px; text-transform:uppercase;

  /* DIVIDER — photo variant (matches Figma "Sec N slide", node 28:4764), 1920x1080 1:1 px */
  .stage.divider-photo{ background:#ffffff; }
  .dp-bg{
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    object-fit:cover; z-index:0;
  }
  .dp-bg-placeholder{
    position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:0;

  .dp-card{
    position:absolute; left:88px; top:72px; width:1402px; height:936px;
    border-radius:40px; overflow:hidden; z-index:1;
    background:rgba(255,255,255,0.8);

  .dp-blob{
    position:absolute; left:679px; top:-212px; width:997px; height:1051px;

  }
  .dp-fg{
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    object-fit:cover; z-index:3; pointer-events:none;
  }
  /* Product cover (Figma 210:19820): card, photos and scribble mirrored; logo, title, description stacked on the left */
  .dp-flip{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform:scaleX(-1); pointer-events:none; }
  .dp-flip.bg{ z-index:0; }
  .dp-flip.fg{ z-index:3; }
  .dp-logo{ position:absolute; left:77px; top:80px; height:80px; z-index:2; }
  .dp-logo img{ height:100%; width:auto; display:block; }
  .dp-desc{
    position:absolute; left:77px; top:602px; width:880px; z-index:2;
    font-family:"Satoshi","Inter",sans-serif; font-weight:400;
    font-size:32px; line-height:40px; letter-spacing:-0.32px; color:#0c1a43;
  }
  .dp-seclabel{
    position:absolute; right:88px; top:70px; z-index:2;
    font-family:"Satoshi","Inter",sans-serif; font-weight:400;
    font-size:30px; letter-spacing:-0.3px; color:#fff; white-space:nowrap;
  }
  .dp-title{
    position:absolute; left:77px; top:203px; width:1240px; z-index:2;
    font-family:"Satoshi","Inter",sans-serif; font-weight:900;
    font-size:120px; line-height:110px; letter-spacing:-2.4px;
    padding-bottom:40px; /* room for descenders (g, p) so background-clip:text doesn't cut them */
    background-image:linear-gradient(180deg,#2d4797 0%,#5367fd 140.34%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  /* Chapter cover (Figma 260:3071 / 260:2387 / 260:1989 / 233:26363): bigger title, lead + body, chapter number, three steps */
  .dp-v2 .dp-logo{ left:70px; top:70px; }
  .dp-v2 .dp-title{ left:70px; top:210px; width:auto; white-space:nowrap; font-size:150px; line-height:130px; letter-spacing:-3px; padding-bottom:40px; }
  .dp-v2 .dp-desc{ left:70px; top:646px; width:756px; display:flex; flex-direction:column; gap:10px; line-height:40px; }
  .dp-v2 .dp-desc p{ margin:0; font-size:30px; letter-spacing:-0.3px; }
  .dp-v2 .dp-desc .dp-lead{ font-weight:700; font-size:32px; letter-spacing:-0.32px; }
  .dp-num{ position:absolute; left:914px; top:40px; z-index:1; pointer-events:none; white-space:nowrap;
    font-family:"Inter",sans-serif; font-weight:800; font-size:339.62px; line-height:339.62px; letter-spacing:-22.11px; color:rgba(64,87,202,0.1); }
  .dp-steps{ position:absolute; left:926px; top:400.4px; width:284px; z-index:2; }

    padding:20.54px 0 0 33px; box-sizing:border-box; font-family:"Satoshi","Inter",sans-serif; font-weight:500; font-size:23.694px; color:#0c1a43; white-space:nowrap; }

  .dp-scribble{
    position:absolute; left:-67.01px; top:910.98px; width:1059.07px; height:288.9px;
    z-index:4; pointer-events:none; transform:scaleX(-1);
  }
  .dp-scribble img{ width:100%; height:100%; display:block; }

  /* PHONE-TRIO — matches Figma "Onboarding to Homepage" (node 33:7115), 1920x1080 1:1 px */
  .stage.phones3{ background:#f4f5e7; }

  .p3-header-left img{ height:20px; width:auto; display:block; }
  .p3-header-left span{ font-family:"Satoshi","Inter",sans-serif; font-weight:500; font-size:22px; color:#fff; }
  .p3-header-right{ font-family:"JetBrains Mono",monospace; font-size:15px; color:#fff; }
  .p3-title{
    position:absolute; left:65px; top:130px; width:1790px; white-space:nowrap; z-index:2;

  }

  /* ---- MOTION -------------------------------------------------------
     One system for the whole deck. Keyframes only define the *from* state
     (fill-mode: backwards), so every element settles on its own authored
     styles and the finished slide is pixel-identical to the static one.
     Only the individual `translate` / `scale` properties move, so each
     element's own `transform` (rotations, flips, angled mockups) is never
     touched. Roles and delays are assigned in JS (assignMotion). */
  :root{
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  /* Slide transition: soft crossfade, incoming slide rises 12px */
  .slide.is-leaving{ display:block; z-index:1; pointer-events:none; animation:mo-slide-out 400ms var(--ease-out) forwards; }
  .slide.is-entering{ z-index:2; animation:mo-slide-in 550ms var(--ease-out) backwards; }
  @keyframes mo-slide-in{ from{ opacity:0; translate:0 12px; } }
  @keyframes mo-slide-out{ to{ opacity:0; } }

  /* Entrance choreography: header → title → product → points → decor */
  .slide.play [data-mo]{
    animation-duration:var(--mo-t);
    animation-delay:var(--mo-d, 0ms);
    animation-timing-function:var(--ease-out);
    animation-fill-mode:backwards;
  }
  .slide.play [data-mo="header"]{ --mo-t:420ms; animation-name:mo-lift-sm; }
  .slide.play [data-mo="title"] { --mo-t:650ms; animation-name:mo-title; }
  .slide.play [data-mo="hero"]  { --mo-t:850ms; animation-name:mo-hero; }
  .slide.play [data-mo="float"] { --mo-t:600ms; animation-name:mo-lift; }
  .slide.play [data-mo="item"]  { --mo-t:500ms; animation-name:mo-lift; }
  .slide.play [data-mo="card"]  { --mo-t:700ms; animation-name:mo-lift; }
  .slide.play [data-mo="decor"] { --mo-t:900ms; animation-name:mo-drift; }
  /* Cover photo: pure fade so it registers exactly on the blurred copy behind it (movement would ghost) */
  .slide.play [data-mo="photo"] { --mo-t:900ms; animation-name:mo-fade-in; }

  @keyframes mo-lift-sm{ from{ opacity:0; translate:0 8px; } }
  @keyframes mo-lift   { from{ opacity:0; translate:0 20px; } }
  @keyframes mo-hero   { from{ opacity:0; translate:0 24px; scale:0.97; } }
  @keyframes mo-drift  { from{ opacity:0; translate:0 12px; } }
  @keyframes mo-fade-in{ from{ opacity:0; } }
  /* Title rises out of a mask line under its final position */
  @keyframes mo-title{
    from{ opacity:0; translate:0 32px; clip-path:inset(-40px -40px 32px -40px); }
    to  { clip-path:inset(-40px -40px -60px -40px); }
  }

        <div class="sai-list">${listHtml}</div>
        <div class="sai-mockup"><img src="assets/web/shikho-ai/mockup-scribble.webp" alt=""></div>
      </div>`;
  } else if(data.type === 'homepage2'){
    section.innerHTML = `
      <div class="stage homepage2">
        <div class="hp-header-bar">
          <div class="hp-header-left"><img src="assets/phone/bird-icon-colored.svg" alt=""><span class="editable" contenteditable="true">${data.header||''}</span></div>
          <div class="hp-header-right editable" contenteditable="true">${data.pageTag||''}</div>
        </div>
        <div class="hp-phone">
          <div class="hp-screen" data-media data-src="${data.phoneImg}" data-label="Mobile screen"></div>
          <img class="hp-frame" src="assets/web/phone/iphone-frame1.webp" alt="">
        </div>
        ${HB('bottom')}
        <div class="hp-scribble"><img src="assets/homepage/scribble-orange.svg" alt=""></div>
        <div class="hp-laptop">
          <div class="hp-screen" data-media data-src="${data.laptopImg}" data-label="Laptop screen"></div>
          <img class="hp-frame" src="assets/web/homepage/macbook-frame.webp" alt="">
        </div>
        <div class="hp-title editable" contenteditable="true">${data.title}</div>
      </div>`;
  } else {
    const bulletsHtml = data.bullets
      ? `<ul class="content-bullets">${data.bullets.map(b=>`<li class="editable" contenteditable="true">${b}</li>`).join('')}</ul>`
      : '';
    section.innerHTML = `
      <div class="stage">
        ${WAVY(false)}
        <div class="crumb editable" contenteditable="true">${data.section}</div>
        <div class="content-title editable" contenteditable="true">${data.title}</div>
        ${bulletsHtml}
        <div class="media-slot" data-media data-src="${data.img}" data-label="${data.title.replace(/<[^>]+>/g,'')}" ${data.edge?'data-edge="true"':''}></div>
      </div>`;
  }
  section.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  if(data.feature || data.chapter || data.pageHeader) applyFeatureHeader(section, data);
  return section;
}

// Feature slides (Figma 256:30917): product name, feature pill, rule, chapter and page on one line
function applyFeatureHeader(section, data){
  const bar = section.querySelector('.p3-header-bar, .hp-header-bar, .sai-header-bar, .cl-header-bar');
  if(!bar) return;
  const bird = bar.querySelector('img');
  bar.classList.add('feat-header');
  if(bar.classList.contains('hp-header-bar')) bar.classList.add('feat-dark');
  bar.innerHTML = `<img src="${bird ? bird.getAttribute('src') : 'assets/phone/bird-icon.svg'}" alt="">`+
    `<span class="feat-product">${data.header}</span>${data.feature ? `<span class="feat-pill">${data.feature}</span>` : ''}`+
    `<i class="feat-rule"></i><span class="feat-meta">${data.chapter ? `CHAPTER ${data.chapter} · ` : ''}Page ${data.pageTag}</span>`;
  const oldRule = section.querySelector('.intro-header-bar-rule');
  if(oldRule) oldRule.remove();
  section.querySelector('.stage').classList.add('feat-stage');
}

function loadMedia(slot){
  const src = slot.dataset.src;
  const label = slot.dataset.label || '';
  const edge = slot.dataset.edge === 'true';
  const isBg = slot.dataset.bg === 'true';
  const isPhoneScreen = slot.classList.contains('p3-screen') || slot.classList.contains('hp-screen');

  if(isPhoneScreen){
    slot.classList.add('placeholder');
    slot.innerHTML = `<div class="ph-inner"><div class="ph-icon">&#128241;</div><div class="ph-label">${label}</div><div class="ph-path">${src||''}</div></div>`;
    if(!src) return;
    const probe = new Image();
    probe.onload = () => {
      slot.classList.remove('placeholder');
      slot.innerHTML = '';
      const im = document.createElement('img');
      im.src = src; im.alt = label;
      slot.appendChild(im);
    };
    probe.src = src;
    return;
  }

  if(isBg){
    slot.classList.add('dp-bg-placeholder');
    slot.innerHTML = `<div class="ph-inner"><div class="ph-icon">&#128247;</div><div class="ph-label">${label}</div><div class="ph-path">${src}</div></div>`;
    if(!src) return;
    const probe = new Image();
    probe.onload = () => {
      slot.classList.remove('dp-bg-placeholder');
      slot.classList.add('dp-bg');
      slot.innerHTML = '';
      const im = document.createElement('img');
      im.src = src; im.alt = label;
      im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      slot.appendChild(im);
    };
    probe.src = src;
    return;
  }

  if(!src){
    slot.innerHTML = `<div class="ph-card"><div class="ph-inner"><div class="ph-icon">&#128247;</div><div class="ph-label">${label}</div></div></div>`;
    return;
  }
  const probe = new Image();
  probe.onload = () => {
    slot.classList.remove('placeholder');
    slot.innerHTML = '';
    const im = document.createElement('img');
    im.src = src; im.alt = label;
    if(edge) slot.classList.add('edge');
    slot.appendChild(im);
  };
  probe.onerror = () => {
    slot.innerHTML = `<div class="ph-card"><div class="ph-inner"><div class="ph-icon">&#128247;</div><div class="ph-label">${label}</div><div class="ph-path">${src}</div></div></div>`;
  };
  probe.src = src;
}

SLIDES.forEach((data, i) => {
  const el = slideEl(data, i);
  el.querySelectorAll('img[src]').forEach(im=>{ im.dataset.deferSrc = im.getAttribute('src'); im.removeAttribute('src'); });
  deck.appendChild(document.adoptNode(el));
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${i+1}. ${(data.title||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&')}`;
  jump.appendChild(opt);
});

const slides = Array.from(document.querySelectorAll('.slide'));
document.getElementById('tot').textContent = slides.length;

function scaleStages(){
  document.querySelectorAll('.stage').forEach(st=>{
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    st.style.transform = `translate(-50%,-50%) scale(${scale})`;
  });
}

// ---- MOTION: tag each element with a role + delay (see MOTION css) ----
// Order of attention: header → title → product → points → decor.
// Backgrounds (photo bands, full-bleed bgs) never animate; they arrive with the slide crossfade.
const MO = { header:0, title:120, hero:300, heroStep:110, float:150, items:620, itemStep:170, decor:950 };
function moSet(el, role, delay){ el.dataset.mo = role; el.style.setProperty('--mo-d', Math.round(delay)+'ms'); }
function moIsBg(el){
  const c = el.classList;
  if(c.contains('hb') || c.contains('tb') || c.contains('hero-bg') || c.contains('sai-bg')) return true;
  if(c.contains('dp-flip') && c.contains('bg')) return true;
  return el.tagName === 'IMG' && !el.className && /-bg\./.test(el.getAttribute('src') || el.dataset.deferSrc || '');
}
function assignMotion(section){
  const stage = section.querySelector('.stage');
  if(!stage) return;
  const heroes = [], floats = [], decors = [];
  let items = [];
  [...stage.children].forEach(el=>{
    const cls = el.getAttribute('class') || '';   // works for SVG elements too (className is an object there)
    if(moIsBg(el)) return;
    if(/header-bar|hero-logo/.test(cls)) return moSet(el, 'header', MO.header);
    if(/-title\b/.test(cls)) return moSet(el, 'title', MO.title);
    if(/decor|scribble/.test(cls)){ decors.push(el); return; }
    if(/-list\b/.test(cls)){ items = items.concat([...el.children]); return; }
    if(/hero-subtitle/.test(cls)){ items.push(el); return; }
    if(el.classList.contains('dp-card')){
      // Product cover: card settles first, then its contents in the same order as other slides
      moSet(el, 'card', 0);
      el.querySelectorAll('.dp-logo, .dp-seclabel').forEach(x=>moSet(x, 'header', 180));
      el.querySelectorAll('.dp-title').forEach(x=>moSet(x, 'title', 280));
      el.querySelectorAll('.dp-num').forEach(x=>moSet(x, 'card', 240));
      el.querySelectorAll('.dp-desc').forEach(x=>moSet(x, 'item', 520));
      el.querySelectorAll('.dp-step').forEach((x,k)=>moSet(x, 'item', 640 + k*120));
      return;
    }
    if(el.classList.contains('dp-flip')) return moSet(el, 'photo', 250);
    if(/flow-arrow/.test(cls)) return;               // draws itself (see .flow-line)
    if(/cl-float/.test(cls)) return floats.push(el);
    heroes.push(el);
  });
  // Product visuals: main devices left to right, floating cards follow the device they describe
  heroes.forEach((el,k)=>moSet(el, 'hero', MO.hero + k*MO.heroStep));
  const afterHero = MO.hero + Math.max(heroes.length-1, 0)*MO.heroStep + MO.float;
  floats.forEach((el,k)=>moSet(el, 'float', afterHero + k*MO.heroStep));
  // Points: 01 establishes itself before 02 arrives
  items.forEach((el,k)=>moSet(el, 'item', MO.items + k*MO.itemStep));
  // Scribbles are the accent: drawn once the copy has landed, one after another
  const lastItem = items.length ? MO.items + (items.length-1)*MO.itemStep : 0;
  const scribbleAt = Math.max(MO.decor, lastItem + 250);
  decors.forEach((el,k)=>{
    const drawn = el.matches('svg.scribble-draw') || el.querySelector('svg.scribble-draw');
    moSet(el, drawn ? 'scribble' : 'decor', scribbleAt + k*150);
  });
}

// ---- SCRIBBLES: drawn along the stroke, like a pen ----
// Each scribble <img> becomes an inline <svg> that shows the very same file, masked by its
// pen-order map (alpha 255 = where the pen starts, 1 = where it lifts). Sweeping the mask's
// threshold reveals the ink in drawing order. The mask is removed once drawn, so the
// resting state is the untouched original artwork.
const SVGNS = 'http://www.w3.org/2000/svg';
let scribbleUid = 0;
function prepareScribble(img){
  const src = img.getAttribute('src') || img.dataset.deferSrc || '';
  const info = SCRIBBLE_MAPS[src.split('?')[0]];
  if(!info) return;
  const id = 'scr' + (++scribbleUid);
  const [x, y, w, h] = info.vb;
  const box = `x="${x}" y="${y}" width="${w}" height="${h}"`;
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', info.vb.join(' '));
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', ((img.getAttribute('class')||'') + ' scribble-draw').trim());
  if(img.getAttribute('style')) svg.setAttribute('style', img.getAttribute('style'));
  else if(!img.getAttribute('class')) svg.setAttribute('style', 'width:100%; height:100%; display:block;');
  svg.innerHTML =
    `<defs><filter id="${id}f" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">` +
      `<feComponentTransfer><feFuncA type="linear" slope="0" intercept="0"/></feComponentTransfer></filter>` +
    `<mask id="${id}m" maskUnits="userSpaceOnUse" ${box} style="mask-type:alpha">` +
      `<image data-href="${info.map}" ${box} preserveAspectRatio="none" filter="url(#${id}f)"/></mask></defs>` +
    `<image class="scribble-art" data-href="${src}" ${box}/>`;
  svg._scribble = { info, map: null, maskUrl: `url(#${id}m)`, art: svg.querySelector('.scribble-art'), fn: svg.querySelector('feFuncA'), token: 0 };
  img.replaceWith(svg);
}
slides.forEach(s=>s.querySelectorAll('.stage img').forEach(img=>{
  const host = img.parentElement.classList.contains('stage') ? img : img.parentElement;
  if(/decor|scribble/.test(String(host.className))) prepareScribble(img);
}));

const SCRIBBLE_EDGE = 14;                       // softness of the drawing front (higher = crisper)
const penEase = t => 1 - (1 - t) * (1 - t);      // ease-out quad: confident start, gentle lift-off
// Part of the stroke (in pen time, 0–1) that lands inside the slide. Many scribbles bleed off
// the edge; spending draw time there would read as a pause before anything appears.
function scribbleVisibleRange(svg){
  const s = svg._scribble;
  if(s.range) return s.range;
  const im = s.map;
  if(!im || !im.complete || !im.naturalWidth) return [0, 1];
  s.range = [0, 1];
  try{
    const W = im.naturalWidth, H = im.naturalHeight;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, W, H).data;
    const ctm = svg.getScreenCTM(), stage = svg.closest('.stage').getBoundingClientRect();
    const sc = stage.width / 1920, [vx, vy, vw, vh] = s.info.vb;
    let lo = 1, hi = 0;
    for(let j = 0; j < H; j += 3) for(let i = 0; i < W; i += 3){
      const o = (j*W + i) * 4;
      if(d[o] < 128) continue;                                   // not ink
      const x = vx + (i + 0.5)*vw/W, y = vy + (j + 0.5)*vh/H;
      const sx = (ctm.a*x + ctm.c*y + ctm.e - stage.left) / sc;
      const sy = (ctm.b*x + ctm.d*y + ctm.f - stage.top) / sc;
      if(sx < 0 || sy < 0 || sx > 1920 || sy > 1080) continue;   // off the slide
      const t = (255 - d[o + 3]) / 254;
      if(t < lo) lo = t;
      if(t > hi) hi = t;
    }
    if(hi > lo) s.range = [lo, hi];
  }catch(e){ /* map not readable (e.g. opened from disk): draw the whole stroke */ }
  return s.range;
}
function scribbleShow(svg){ const s = svg._scribble; s.token++; s.art.removeAttribute('mask'); }
function scribbleDraw(svg, delay){
  const s = svg._scribble, info = s.info, token = ++s.token;
  // Direction on screen, after any flip/rotation on this slide: left→right, or top→bottom if mostly vertical
  const ctm = svg.getScreenCTM();
  if(!ctm) return scribbleShow(svg);
  const at = p => ({ x: ctm.a*p[0] + ctm.c*p[1], y: ctm.b*p[0] + ctm.d*p[1] });
  const pa = at(info.a), pb = at(info.b), dx = pb.x - pa.x, dy = pb.y - pa.y;
  // Hands move sideways far more than down, so horizontal wins unless the stroke is clearly vertical
  const reverse = Math.abs(dx) >= 0.4*Math.abs(dy) ? dx < 0 : dy < 0;
  const K = SCRIBBLE_EDGE;
  const setProgress = p => {
    s.fn.setAttribute('slope', reverse ? -K : K);
    s.fn.setAttribute('intercept', reverse ? K*p : K*(p - 1));
  };
  const [lo, hi] = scribbleVisibleRange(svg);
  const from = reverse ? 1 - hi : lo, span = (hi - lo) + 1/K;
  // Longer strokes take longer: 700–1400ms by the drawn length visible on the slide
  const stageScale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const len = info.len * (hi - lo) * Math.hypot(ctm.a, ctm.b) / stageScale;
  const dur = Math.min(1400, Math.max(700, 550 + len*0.3));
  setProgress(from);
  s.art.setAttribute('mask', s.maskUrl);
  setTimeout(()=>{
    if(token !== s.token) return;
    const t0 = performance.now();
    const frame = now => {
      if(token !== s.token) return;
      const t = Math.min(1, (now - t0) / dur);
      setProgress(from + penEase(t) * span);
      if(t < 1) requestAnimationFrame(frame);
      else scribbleShow(svg);
    };
    requestAnimationFrame(frame);
  }, delay);
}
function playScribbles(slide){
  slide.querySelectorAll('svg.scribble-draw').forEach(svg=>{
    const host = svg.closest('[data-mo]');
    if(reduceMotion.matches || !host) return scribbleShow(svg);
    scribbleDraw(svg, parseFloat(host.style.getPropertyValue('--mo-d')) || 0);
  });
}
function restScribbles(slide){ slide.querySelectorAll('svg.scribble-draw').forEach(scribbleShow); }
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

slides.forEach(assignMotion);

// ---- LOADING: slide 1 first, then the rest quietly in slide order ----
// Any slide you navigate to (and the one after it) jumps the queue.
const slideLoads = new Map();
function loadSlide(i){
  if(i < 0 || i >= slides.length) return Promise.resolve();
  if(slideLoads.has(i)) return slideLoads.get(i);
  const slide = slides[i], waits = [];
  const track = im => waits.push(new Promise(done=>{
    if(im.complete) return done();
    im.addEventListener('load', done, { once:true });
    im.addEventListener('error', done, { once:true });
  }));
  slide.querySelectorAll('img[data-defer-src]').forEach(im=>{
    im.src = im.dataset.deferSrc;
    im.removeAttribute('data-defer-src');
    track(im);
  });
  slide.querySelectorAll('[data-media]').forEach(loadMedia);
  slide.querySelectorAll('image[data-href]').forEach(el=>{
    el.setAttribute('href', el.dataset.href);
    el.removeAttribute('data-href');
  });
  slide.querySelectorAll('svg.scribble-draw').forEach(svg=>{
    const s = svg._scribble;
    s.map = new Image();
    s.map.src = s.info.map;
    track(s.map);
  });
  const loaded = Promise.all(waits);
  slideLoads.set(i, loaded);
  return loaded;
}
// ---- Smart Class AI card: live gradient shader ----
// Figma's radial gradient (matrix 36.6 4.9 -2.452 18.315 6 0, r=10) with a slow light drifting through it.
// Renders only while its slide is on screen; a single still frame under reduced motion.
function startAiCardShaders(){
  document.querySelectorAll('.sc2-ai-shader').forEach(canvas=>{
    const gl = canvas.getContext('webgl', { premultipliedAlpha:false, antialias:false, preserveDrawingBuffer:true });
    if(!gl) return;                                   // CSS gradient underneath stays as the fallback
    canvas.width = 744; canvas.height = 196;          // 2x the card's 372x98
    const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
    const fs = `precision mediump float;
      uniform float t; uniform vec2 res;
      vec3 ramp(float x){
        vec3 c0 = vec3(60.,45.,78.)/255., c1 = vec3(80.,60.,104.)/255., c2 = vec3(100.,74.,129.)/255., c3 = vec3(139.,104.,180.)/255.;
        x = clamp(x, 0., 1.);
        if(x < .25) return mix(c0, c1, x/.25);
        if(x < .5)  return mix(c1, c2, (x-.25)/.25);
        return mix(c2, c3, (x-.5)/.5);
      }
      float n(vec2 q){ return sin(q.x)*sin(q.y); }
      void main(){
        vec2 P = vec2(gl_FragCoord.x, res.y - gl_FragCoord.y) / res * vec2(372., 98.);
        // inverse of Figma's gradientTransform
        vec2 d = P - vec2(6., 0.);
        float det = 36.6*18.315 - (-2.452)*4.9;
        vec2 u = vec2(18.315*d.x + 2.452*d.y, -4.9*d.x + 36.6*d.y) / det;
        float g = length(u) / 10.;
        // Aurora: two soft glows (magenta + lavender) wander across the card, plus a slow diagonal light sweep
        vec2 uv = P / vec2(372., 98.);
        vec2 asp = vec2(3.8, 1.);
        vec2 b1 = vec2(.5 + .42*sin(t*.45), .5 + .45*sin(t*.63 + 1.3));
        vec2 b2 = vec2(.5 + .42*sin(t*.37 + 2.4), .5 + .45*cos(t*.51));
        float g1 = exp(-dot((uv-b1)*asp, (uv-b1)*asp) * 2.2);
        float g2 = exp(-dot((uv-b2)*asp, (uv-b2)*asp) * 2.6);
        float sweep = smoothstep(.35, 0., abs(uv.x*.8 - uv.y*.35 - fract(t*.07)*1.6 + .3));
        vec3 col = ramp(g);
        col = mix(col, vec3(.73, .11, .93), g1*.42);     // Figma star magenta #BA1DEE
        col = mix(col, vec3(.62, .52, .95), g2*.38);     // soft lavender
        col += vec3(.10, .08, .14) * sweep;
        gl_FragColor = vec4(min(col, vec3(.78, .66, .95)), 1.);
      }`;
    const sh = (type, src)=>{ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uT = gl.getUniformLocation(prog, 't');
    gl.uniform2f(gl.getUniformLocation(prog, 'res'), canvas.width, canvas.height);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const draw = sec=>{ gl.uniform1f(uT, sec); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
    const slide = canvas.closest('.slide');
    draw(0);
    if(reduceMotion.matches) return;
    const frame = now=>{
      if(slide.classList.contains('active')) draw(now / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}
startAiCardShaders();

loadSlide(0).then(async ()=>{
  for(let i = 1; i < slides.length; i++) await loadSlide(i);
});

function show(i, replay){
  const forward = i > idx || !!replay;
  // No wrap-around: stop at the first and last slide
  if(i<0) i = 0;
  if(i>=slides.length) i = slides.length-1;
  if(i === idx) return;
  loadSlide(i);
  loadSlide(i + 1);
  const prev = slides[idx], next = slides[i];

  prev.classList.remove('active', 'is-entering', 'play');
  prev.classList.add('is-leaving');
  clearTimeout(prev._moLeave);
  prev._moLeave = setTimeout(()=>prev.classList.remove('is-leaving'), 420);

  next.classList.remove('is-leaving', 'is-entering', 'play');
  void next.offsetWidth; // restart animations
  next.classList.add('active', 'is-entering');
  // Full choreography when moving forward; going back just crossfades to what was already seen
  if(forward){ next.classList.add('play'); playScribbles(next); }
  else restScribbles(next);
  clearTimeout(next._moEnter);
  next._moEnter = setTimeout(()=>next.classList.remove('is-entering'), 600);

  idx = i;
  document.getElementById('cur').textContent = idx+1;
  jump.value = idx;
}
slides[0].classList.add('active', 'play');
playScribbles(slides[0]);

document.getElementById('prev').addEventListener('click', ()=>show(idx-1));
document.getElementById('next').addEventListener('click', ()=>show(idx+1));
jump.addEventListener('change', (e)=> show(parseInt(e.target.value,10)));

window.addEventListener('keydown', (e)=>{
  if(e.target.isContentEditable) return;
  if(e.key==='ArrowRight' || e.key===' ') { show(idx+1); e.preventDefault(); }
  if(e.key==='ArrowLeft') { show(idx-1); e.preventDefault(); }
  if(e.key.toLowerCase()==='f') {
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

window.addEventListener('resize', scaleStages);
scaleStages();
